server:
  port: 8080

spring:
  application:
    name: rephone-server
  config:
    # 本地密钥：.env 已被 gitignore，Spring Boot 直接把它当属性源读，无需额外依赖。
    # 三个候选路径分别覆盖 cwd = server/、server/start（mvnw test 的 cwd）、仓库根。
    # 生产环境请用系统环境变量注入，不要把 .env 部署上去。
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:./server/.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/rephone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      # 启动时执行幂等建表（CREATE TABLE IF NOT EXISTS），可关：--spring.sql.init.mode=never
      mode: ${SQL_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql,classpath:db/schema-quote.sql,classpath:db/schema-recycle.sql,classpath:db/schema-repair.sql,classpath:db/schema-sale.sql,classpath:db/schema-role.sql,classpath:db/data-model-models.sql,classpath:db/data-goods-demo.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

rephone:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:604800}
  wx:
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}
    mock-login: ${WX_MOCK_LOGIN:false}
    subscribe-template-id: ${WX_SUBSCRIBE_TEMPLATE_ID:}
    # 模板字段名：微信申请模板时随机分配（thing1 / character_string2 / time3 …），
    # 必须按小程序后台模板里看到的实际字段名填写；写错或漏配会导致推送返回 47003
    subscribe-field-status: ${WX_SUBSCRIBE_FIELD_STATUS:}
    subscribe-field-order-no: ${WX_SUBSCRIBE_FIELD_ORDER_NO:}
    subscribe-field-time: ${WX_SUBSCRIBE_FIELD_TIME:}
    subscribe-page: ${WX_SUBSCRIBE_PAGE:pages/recycle/order/list/index}
  wxpay:
    mch-id: ${WXPAY_MCH_ID:}
    mch-key: ${WXPAY_MCH_KEY:}
    cert-path: ${WXPAY_CERT_PATH:}
    mock: ${WXPAY_MOCK:false}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    bucket: ${COS_BUCKET:}
    region: ${COS_REGION:ap-guangzhou}
    mock: ${COS_MOCK:false}
  express:
    key: ${EXPRESS_KEY:}
    customer: ${EXPRESS_CUSTOMER:}
    callback-url: ${EXPRESS_CALLBACK_URL:}
    mock: ${EXPRESS_MOCK:true}
  admin:
    token: ${ADMIN_TOKEN:}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

logging:
  level:
    com.rephone: info
