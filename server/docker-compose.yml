name: rephone

services:
  mysql:
    image: mysql:8.0
    container_name: rephone-mysql
    restart: unless-stopped
    environment:
      # 密码来自同目录 .env（已被 gitignore），见 .env.example
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定本机回环：宿主机本地工具可用，公网不可直连 MySQL（上线硬要求）
      - "127.0.0.1:3306:3306"
    volumes:
      - rephone-mysql-data:/var/lib/mysql
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: rephone-redis
    restart: unless-stopped
    ports:
      # 仅绑定本机回环：宿主机本地工具可用，公网不可直连 Redis（上线硬要求）
      - "127.0.0.1:6379:6379"
    volumes:
      - rephone-redis-data:/data

  # 后端服务：源码进镜像（server/Dockerfile 多阶段构建），随 compose 一起启动/自愈。
  # 代码变更后执行 docker compose up -d --build 重建。
  server:
    build: .
    container_name: rephone-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 机型图 / 质检图 / 商品图落在 /app/data（AdminUploadController 存 data/img/，
      # WebResourceConfig 提供 /img/**）。bind 挂载：重建不丢 + 可直接从宿主机预置种子图。
      # （原先用 named volume rephone-uploads，为便于宿主机直接预置图改为 bind 挂载）
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
      # 容器网络内用服务名互连（非 localhost）
      MYSQL_URL: "jdbc:mysql://mysql:3306/rephone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      # 运行 profile：默认 prod —— 让 MockGuardConfig 进入「有 mock 就拒绝启动」的严格模式。
      # 本地开发要跑 mock 时显式覆盖：SPRING_PROFILES_ACTIVE=dev WX_MOCK_LOGIN=true ...
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      # 安全默认值：一律 false。mock 登录会绕过整个 /api/wx/* 认证，
      # mock 支付会伪造支付成功，绝不能作为默认值。
      # 本地开发要闭环时显式开启：WX_MOCK_LOGIN=true（并同时把 profile 设为非 prod）
      WX_MOCK_LOGIN: ${WX_MOCK_LOGIN:-false}
      # 真实登录（WX_MOCK_LOGIN=false）时必填：JWT 签名密钥，值在 .env
      JWT_SECRET: ${JWT_SECRET:-}
      # 故意不给默认值：原来默认 "local-admin-token" 是一个开箱可用的管理端凭证，
      # 部署时忘了覆盖就等于把后台（含用户 PII 与打款操作）公开。留空则只禁用机器令牌，
      # 管理员仍可用账号密码登录。本地要用的值写在 .env 里。
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # 快递100：安全默认 false（真实出网）。本地无 key 时显式开 EXPRESS_MOCK=true。
      # 值来自同目录 .env（compose 自动读它做插值）
      EXPRESS_MOCK: ${EXPRESS_MOCK:-false}
      EXPRESS_KEY: ${EXPRESS_KEY:-}
      EXPRESS_CUSTOMER: ${EXPRESS_CUSTOMER:-}
      EXPRESS_CALLBACK_URL: ${EXPRESS_CALLBACK_URL:-}
      # 微信订阅消息：模板 ID 与字段名同样来自 .env；未配置时接口返回空串，小程序自动跳过订阅弹窗
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_SUBSCRIBE_TEMPLATE_ID: ${WX_SUBSCRIBE_TEMPLATE_ID:-}
      WX_SUBSCRIBE_FIELD_STATUS: ${WX_SUBSCRIBE_FIELD_STATUS:-}
      WX_SUBSCRIBE_FIELD_ORDER_NO: ${WX_SUBSCRIBE_FIELD_ORDER_NO:-}
      WX_SUBSCRIBE_FIELD_TIME: ${WX_SUBSCRIBE_FIELD_TIME:-}
      WX_SUBSCRIBE_PAGE: ${WX_SUBSCRIBE_PAGE:-pages/recycle/order/list/index}
      # 微信支付（V2 JSAPI）：生产必须 WXPAY_MOCK=false 并配置商户号/密钥/公网回调地址
      WXPAY_MCH_ID: ${WXPAY_MCH_ID:-}
      WXPAY_MCH_KEY: ${WXPAY_MCH_KEY:-}
      WXPAY_CERT_PATH: ${WXPAY_CERT_PATH:-}
      WXPAY_MOCK: ${WXPAY_MOCK:-false}
      WXPAY_NOTIFY_URL: ${WXPAY_NOTIFY_URL:-}
      # 支付单自动关闭：30 分钟未支付关闭，每 5 分钟扫描
      PAY_PENDING_TTL_MINUTES: ${PAY_PENDING_TTL_MINUTES:-30}
      PAY_CLOSE_CRON: ${PAY_CLOSE_CRON:-0 */5 * * * *}
      # 腾讯云 COS：生产必须 mock=false 并配置密钥，否则图片直传为演示模式
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_MOCK: ${COS_MOCK:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  rephone-mysql-data:
  rephone-redis-data:
