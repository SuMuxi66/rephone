name: rephone

services:
  mysql:
    image: mysql:8.0
    container_name: rephone-mysql
    restart: unless-stopped
    environment:
      # 密码来自同目录 .env（已被 gitignore），见 .env.example
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - rephone-mysql-data:/var/lib/mysql
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: rephone-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rephone-redis-data:/data

  # 后端服务：源码进镜像（server/Dockerfile 多阶段构建），随 compose 一起启动/自愈。
  # 代码变更后执行 docker compose up -d --build 重建。
  server:
    build: .
    container_name: rephone-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Shanghai
      # 容器网络内用服务名互连（非 localhost）
      MYSQL_URL: "jdbc:mysql://mysql:3306/rephone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_HOST: redis
      # 开发态默认值：mock 登录 + 本地管理令牌；上线用环境变量覆盖
      WX_MOCK_LOGIN: ${WX_MOCK_LOGIN:-true}
      # 故意不给默认值：原来默认 "local-admin-token" 是一个开箱可用的管理端凭证，
      # 部署时忘了覆盖就等于把后台（含用户 PII 与打款操作）公开。留空则只禁用机器令牌，
      # 管理员仍可用账号密码登录。本地要用的值写在 .env 里。
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # 快递100 真实出网配置：值来自同目录 .env（compose 自动读它做插值），缺省保持 mock
      EXPRESS_MOCK: ${EXPRESS_MOCK:-true}
      EXPRESS_KEY: ${EXPRESS_KEY:-}
      EXPRESS_CUSTOMER: ${EXPRESS_CUSTOMER:-}
      EXPRESS_CALLBACK_URL: ${EXPRESS_CALLBACK_URL:-}
      # 微信订阅消息：模板 ID 与字段名同样来自 .env；未配置时接口返回空串，小程序自动跳过订阅弹窗
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_SUBSCRIBE_TEMPLATE_ID: ${WX_SUBSCRIBE_TEMPLATE_ID:-}
      WX_SUBSCRIBE_FIELD_STATUS: ${WX_SUBSCRIBE_FIELD_STATUS:-}
      WX_SUBSCRIBE_FIELD_ORDER_NO: ${WX_SUBSCRIBE_FIELD_ORDER_NO:-}
      WX_SUBSCRIBE_FIELD_TIME: ${WX_SUBSCRIBE_FIELD_TIME:-}
      WX_SUBSCRIBE_PAGE: ${WX_SUBSCRIBE_PAGE:-pages/recycle/order/list/index}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  rephone-mysql-data:
  rephone-redis-data:
